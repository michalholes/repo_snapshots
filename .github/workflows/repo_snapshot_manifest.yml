name: update repo snapshot manifest

on:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '!toolkit.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-snapshot-manifest-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST_NAME: repo_snapshot_manifest.json
  MANIFEST_PUBLISH_MAX_ATTEMPTS: "5"

jobs:
  generate-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate and publish repo_snapshot_manifest.json
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 "$MANIFEST_PUBLISH_MAX_ATTEMPTS"); do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          ROOT = Path(".").resolve()
          MANIFEST_NAME = os.environ["MANIFEST_NAME"]
          REPOSITORY = os.environ["REPOSITORY"]
          BRANCH = os.environ["BRANCH"]

          ZIP_RE = re.compile(r"^(?P<prefix>.+)_(?P<commit>[0-9a-f]{40})\.zip$")

          def utc_now_iso() -> str:
              return (
                  datetime.now(timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z")
              )

          def build_raw_url(rel_path: Path) -> str:
              encoded_branch = quote(BRANCH, safe="")
              encoded_path = "/".join(quote(part, safe="") for part in rel_path.parts)
              return f"https://raw.githubusercontent.com/{REPOSITORY}/{encoded_branch}/{encoded_path}"

          def derive_repo_name(prefix: str) -> str:
              repo_name = prefix.split("-", 1)[0]
              if not repo_name:
                  raise SystemExit(f"Cannot derive repository name from prefix: {prefix}")
              return repo_name

          zip_paths = sorted(
              p for p in ROOT.rglob("*.zip")
              if p.is_file() and ".git" not in p.parts
          )

          targets: dict[str, dict[str, str]] = {}

          for path in zip_paths:
              rel = path.relative_to(ROOT)
              basename = path.name

              if basename == "toolkit.zip":
                  continue

              match = ZIP_RE.fullmatch(basename)
              if not match:
                  raise SystemExit(
                      f"Unexpected ZIP filename: {rel.as_posix()}\n"
                      "Expected pattern: <repo>-<ref>_<40-hex-commit>.zip"
                  )

              prefix = match.group("prefix")
              source_commit = match.group("commit")
              repo_name = derive_repo_name(prefix)

              if repo_name in targets:
                  raise SystemExit(
                      f"Duplicate repository key '{repo_name}' derived from ZIP files.\n"
                      f"Conflicting file already registered: {targets[repo_name]['basename']}\n"
                      f"Conflicting file now found: {basename}"
                  )

              targets[repo_name] = {
                  "basename": basename,
                  "raw_url": build_raw_url(rel),
                  "source_commit": source_commit,
              }

          manifest = {
              "schema_version": 1,
              "repository": REPOSITORY,
              "branch": BRANCH,
              "generated_at": utc_now_iso(),
              "targets": targets,
          }

          output = ROOT / MANIFEST_NAME
          output.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          print(f"Wrote {output.name} with {len(targets)} target(s)")
          PY

            git add "$MANIFEST_NAME"

            if git diff --cached --quiet --exit-code; then
              echo "Manifest unchanged."
              exit 0
            fi

            git commit -m "chore: update repo snapshot manifest [skip ci]"

            if git push origin "HEAD:$BRANCH"; then
              echo "Manifest published on attempt ${attempt}."
              exit 0
            fi

            echo "Manifest publish race detected; retrying attempt ${attempt}/${MANIFEST_PUBLISH_MAX_ATTEMPTS}."
            sleep "$((attempt * 2))"
          done

          echo "Manifest publish failed after ${MANIFEST_PUBLISH_MAX_ATTEMPTS} attempts."
          exit 1
